<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导师档案 · 生命科学本科生平台</title>
<link rel="stylesheet" href="css/template.css">
<style>
  .r1-toolbar { position: sticky; top: 0; z-index: 30; background: #f7f4ee; border-bottom: 1px solid #d8d2c6;
    padding: 8px 18px; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; display: flex; gap: 16px; }
  .r1-toolbar a { color: #146b4a; text-decoration: none; }
  .r1-toolbar a:hover { text-decoration: underline; }
  .profile-loading { max-width: 720px; margin: 72px auto; padding: 0 20px; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #42584c; }
  .profile-loading p { margin: 14px 0 0; font-size: 14px; }
  .profile-loading-bar { height: 3px; border-radius: 999px; background: linear-gradient(90deg, #146b4a 0%, #8fc4a8 50%, #146b4a 100%); background-size: 200% 100%; animation: profile-load 1.1s ease-in-out infinite; }
  @keyframes profile-load { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
</style>
</head>
<body>
<div class="r1-toolbar">
  <a href="../">← 返回导师目录</a>
  <a href="../../">← 返回本科生平台</a>
</div>
<div id="root"></div>
<script type="module">
  import { mountProfile } from './app.js';
  const q = new URLSearchParams(location.search);
  const t = q.get('t') || 't02';
  const allowed = ['t01', 't02', 't03'];
  if (!allowed.includes(t)) location.search = 't=t02';
  mountProfile();
</script>
</body>
</html>
