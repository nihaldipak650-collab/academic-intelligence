name: Retired - legacy web rollback (disabled)

# Legacy web/ GitHub Pages rollback is permanently retired.
# It previously required web/reports/*.md that may contain Experience
# markers or review_pending content. Do not re-enable without a full
# security review. Use deploy-frontend-pages.yml for production.

on:
  workflow_dispatch:
    inputs:
      confirm_retired_path:
        description: "This workflow is retired and will always fail closed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refuse:
    name: Refuse legacy web rollback
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "Legacy web/ Pages rollback is retired."
          echo "web/reports has been removed; restoring Experience or review_pending reports is forbidden."
          echo "Use .github/workflows/deploy-frontend-pages.yml for the frontend 1.0 artifact."
          exit 1
